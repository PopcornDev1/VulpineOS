name: Publish vulpineos-worker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish. Leave blank to use date plus commit.
        required: false
        type: string
      build_jobs:
        description: Parallel browser build jobs.
        required: true
        default: "2"
        type: string
      publish_latest:
        description: Also update the latest tag.
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, vulpine-browser-builder]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Check build prerequisites
        run: |
          packages="build-essential make msitools wget unzip python3 python3-dev python3-pip git p7zip-full golang-go aria2 curl rsync libsqlite3-dev"
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt update
            sudo apt install -y $packages
          else
            echo "No passwordless sudo available; assuming build prerequisites were installed on the runner."
          fi

          missing=0
          for command_name in make wget unzip python3 git 7z go aria2c curl rsync docker; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              echo "Missing required command: $command_name" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            cat >&2 <<'EOF'
          Install runner prerequisites once on the self-hosted runner machine, then rerun the workflow:

          sudo apt update
          sudo apt install -y build-essential make msitools wget unzip python3 python3-dev python3-pip git p7zip-full golang-go aria2 curl rsync libsqlite3-dev

          Also ensure Docker is installed and available to the runner user:

          docker ps
          EOF
            exit 1
          fi

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: tag
        shell: bash
        run: |
          tag='${{ inputs.image_tag }}'
          if [ -z "$tag" ]; then
            tag="$(date -u +'%Y%m%d')-${GITHUB_SHA::7}"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Build browser runtime and push image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          BUILD_JOBS: ${{ inputs.build_jobs }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: bash scripts/publish-vulpineos-worker-image.sh

      - name: Published image
        run: |
          echo "ghcr.io/vulpineos/vulpineos-worker:${{ steps.tag.outputs.value }}"
