name: Publish vulpineos-worker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish. Leave blank to use vulpineos_release_tag, then date plus commit.
        required: false
        type: string
      vulpineos_release_tag:
        description: VulpineOS release tag containing camoufox-*-lin.x86_64.zip. Leave blank for latest.
        required: false
        type: string
      publish_latest:
        description: Also update the latest tag.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install image packaging tools
        run: |
          sudo apt update
          sudo apt install -y unzip

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: tag
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.vulpineos_release_tag }}
        run: |
          tag="$INPUT_IMAGE_TAG"
          if [ -z "$tag" ]; then
            tag="$INPUT_RELEASE_TAG"
          fi
          if [ -z "$tag" ]; then
            tag="$(date -u +'%Y%m%d')-${GITHUB_SHA::7}"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Download browser runtime and push image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          VULPINEOS_RELEASE_TAG: ${{ inputs.vulpineos_release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: bash scripts/publish-vulpineos-worker-image.sh

      - name: Published image
        run: |
          echo "ghcr.io/vulpineos/vulpineos-worker:${{ steps.tag.outputs.value }}"
