name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  cli:
    name: VulpineOS CLI (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: vulpineos-linux-amd64
          - goos: linux
            goarch: arm64
            asset: vulpineos-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: vulpineos-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: vulpineos-darwin-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME:-dev}" -o "dist/${ASSET}" ./cmd/vulpineos/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: VulpineOSCLI-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [cli]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("artifacts")
          entries = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              if path.name == "SHA256SUMS":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entries.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(entries) + "\n")
          PY

      - name: Browser artifact gate
        run: |
          echo "Trusted browser artifacts are uploaded manually before publishing."
          echo "This workflow does not build or rewrap browser packages."

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Trusted browser artifacts are uploaded manually before publishing.

            Do not publish this draft until the Vulpine browser packages built
            from this repository's trusted builder path have been attached and
            SHA256SUMS has been refreshed to cover every shipped file.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
